<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fullaz · cloud</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06080e; color: #c9d7ed;
    font: 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  #sky { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  #sky.drag { cursor: grabbing; }
  #hud { position: fixed; inset: 16px auto auto 16px; white-space: pre; pointer-events: none;
    text-shadow: 0 2px 8px #000; }
  #hud b { color: #83d8ff; }
  .muted { color: #72819a; }
  #controls { position: fixed; inset: auto 16px 16px 16px; display: flex; flex-wrap: wrap;
    gap: 14px; align-items: center; padding: 9px 12px; background: rgba(8, 13, 23, .88);
    border: 1px solid #263a55; border-radius: 9px; backdrop-filter: blur(8px); }
  button { font: inherit; color: #c9d7ed; background: #162033; border: 1px solid #314866;
    border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: #1d2b44; }
  label.field { display: flex; gap: 6px; align-items: center; }
  input[type=number] { width: 84px; }
  input { font: inherit; color: #c9d7ed; background: #0f1726; border: 1px solid #314866;
    border-radius: 5px; padding: 3px 5px; accent-color: #248cff; }
  .spacer { flex: 1; }
  .hint { color: #72819a; }
  #storage { position: fixed; inset: 16px 16px auto auto; width: 268px; padding: 10px;
    background: rgba(8, 13, 23, .88); border: 1px solid #263a55; border-radius: 9px;
    backdrop-filter: blur(8px); }
  #storage.hidden { display: none; }
  #map { display: block; width: 100%; height: 132px; image-rendering: pixelated;
    border: 1px solid #243041; border-radius: 4px; background: #0b1220; }
  #legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; margin-top: 8px; }
  #legend span { display: flex; gap: 6px; align-items: center; }
  #legend i { width: 10px; height: 10px; border-radius: 2px; }
  #map-stats { color: #72819a; margin-bottom: 6px; }
  @media (max-width: 900px) { #storage { display: none; } .hint { display: none; } }
</style>

<canvas id="sky"></canvas>
<div id="hud">loading…</div>

<div id="storage">
  <div><strong>physical image</strong></div>
  <div id="map-stats"></div>
  <canvas id="map"></canvas>
  <div id="legend">
    <span><i style="background:#9b7bbd"></i>superblock</span>
    <span><i style="background:#ad7d57"></i>tree nodes</span>
    <span><i style="background:#2f5963"></i>point chunks</span>
    <span><i style="background:#4e7c68"></i>free-space map</span>
    <span><i style="background:#6f863f"></i>reusable free page</span>
    <span><i style="background:#765b6a"></i>wasted (split leftovers)</span>
  </div>
</div>

<div id="controls">
  <button id="reset">new cloud</button>
  <button id="add">add 10k points</button>
  <button id="remove">remove 5k points</button>
  <label class="field"><span>points</span><input id="points" type="number" min="1000" max="500000" step="1000" value="60000"></label>
  <label class="field"><span>detail</span><input id="detail" type="range" min="0.5" max="20" step="0.5" value="5"><output id="detail-value">5%</output></label>
  <button id="download">download image</button>
  <label class="field"><span>open</span><input id="upload" type="file" accept=".cld,application/octet-stream" style="width:150px"></label>
  <button id="toggle-map">hide map</button>
  <label><input id="invert-mouse" type="checkbox"> invert mouse</label>
  <span class="spacer"></span>
  <span class="hint">drag/touch to orbit · wheel/pinch to zoom</span>
</div>

<script>
const canvas = document.getElementById("sky"), ctx = canvas.getContext("2d");
const mapCanvas = document.getElementById("map"), mapCtx = mapCanvas.getContext("2d");
const el = {
  hud: document.getElementById("hud"), reset: document.getElementById("reset"),
  add: document.getElementById("add"), remove: document.getElementById("remove"), points: document.getElementById("points"),
  detail: document.getElementById("detail"), detailValue: document.getElementById("detail-value"),
  download: document.getElementById("download"), upload: document.getElementById("upload"),
  storage: document.getElementById("storage"), mapStats: document.getElementById("map-stats"),
  toggleMap: document.getElementById("toggle-map"), invertMouse: document.getElementById("invert-mouse"),
};

const ROLE_COLOURS = ["#b36a6a", "#9b7bbd", "#ad7d57", "#2f5963", "#4e7c68", "#6f863f", "#765b6a"];
const ROLE_NAMES = ["unknown", "superblock", "nodes", "chunks", "fsm", "free", "wasted"];

let ex = null, dpr = 1, dirty = true, failure = "", seed = 0;
let removing = false;
// Chunk waste only changes when the point set does, not when the camera does:
// finding it walks every entry in the tree, so it stays off the per-frame path.
let storageDirty = true;

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  dirty = true;
}
addEventListener("resize", resize);

function errorText() {
  const len = ex.lastErrorLen();
  if (!len) return "";
  return new TextDecoder().decode(new Uint8Array(ex.memory.buffer, ex.lastErrorPtr(), len));
}
function ensure(ok, what) {
  if (!ok) throw new Error(`${what}: ${errorText() || "failed"}`);
}

// --- persistence -----------------------------------------------------------
const db = new Promise((resolve, reject) => {
  const request = indexedDB.open("fullaz-cloud", 1);
  request.onupgradeneeded = () => request.result.createObjectStore("images");
  request.onsuccess = () => resolve(request.result);
  request.onerror = () => reject(request.error);
});
function store(mode) { return db.then((d) => d.transaction("images", mode).objectStore("images")); }
async function dbGet() {
  const s = await store("readonly");
  return new Promise((res, rej) => { const r = s.get("default"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function dbPut(bytes) {
  const s = await store("readwrite");
  return new Promise((res, rej) => { const r = s.put(bytes, "default"); r.onsuccess = () => res(); r.onerror = () => rej(r.error); });
}
function imageBytes() {
  const ptr = ex.imagePtr(), len = ex.imageLen();
  ensure(ptr !== 0 || len === 0, "flush");
  // .slice() copies out: the view detaches the moment the wasm heap grows.
  return new Uint8Array(ex.memory.buffer, ptr, len).slice();
}
async function persist() { try { await dbPut(imageBytes().buffer); } catch (error) { failure = `save failed: ${error}`; } }

function importBytes(bytes) {
  const ptr = ex.allocate(bytes.byteLength);
  if (!ptr) throw new Error("wasm allocation failed");
  try {
    new Uint8Array(ex.memory.buffer).set(new Uint8Array(bytes), ptr);
    ensure(ex.importImage(ptr, bytes.byteLength), "open image");
  } finally {
    ex.freeAllocation(ptr, bytes.byteLength);
  }
}

// --- rendering -------------------------------------------------------------
function draw() {
  requestAnimationFrame(draw);
  if (!ex) return;

  const w = canvas.width, h = canvas.height;
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#06080e";
  ctx.fillRect(0, 0, w, h);

  if (dirty) {
    try { ex.renderFrame(w, h); failure = ""; }
    catch (error) { failure = `render failed: ${error}`; }
    dirty = false;
    refreshMap();
  }

  const count = ex.splatsCount();
  // Re-viewed every frame: growing the wasm heap detaches older views.
  const data = new Float32Array(ex.memory.buffer, ex.splatsPtr(), count * 8);
  // Additive, so overlapping splats accumulate brightness and the draw order
  // does not matter -- which is why nothing is sorted anywhere.
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < count; i++) {
    const b = i * 8;
    const radius = Math.max(data[b + 2], 0.6 * dpr);
    ctx.fillStyle = `rgb(${data[b + 4] | 0},${data[b + 5] | 0},${data[b + 6] | 0})`;
    ctx.globalAlpha = data[b + 7] > 1 ? 0.95 : 0.72;
    ctx.fillRect(data[b] - radius, data[b + 1] - radius, radius * 2, radius * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  drawHud(count);
}

function drawHud(splats) {
  const points = ex.pointCount(), pages = ex.pagesTotal(), pageBytes = ex.pageBytes();
  const bytes = pages * pageBytes;
  const label = (s) => s.padEnd(14);
  el.hud.innerHTML =
    `<b>fullaz · cloud</b>  <span class="muted">wasm · paged octree · LOD</span>\n\n` +
    `${label("points")}${points.toLocaleString()}\n` +
    `${label("splats")}${splats.toLocaleString()}` +
    (points ? `  <span class="muted">${(points / Math.max(splats, 1)).toFixed(1)}x fewer</span>` : "") + `\n` +
    `${label("aggregates")}${ex.nodesAccepted().toLocaleString()}\n` +
    `${label("drawn singly")}${ex.pointsDrawn().toLocaleString()}\n` +
    `${label("nodes seen")}${ex.nodesVisited().toLocaleString()}   <span class="muted">culled ${ex.nodesCulled().toLocaleString()}</span>\n` +
    `${label("detail")}${(ex.detailFraction() * 100).toFixed(1)}% of height\n` +
    `${label("distance")}${(ex.cameraDistance() / ex.worldSide()).toFixed(2)} cubes\n` +
    `${label("image")}${(bytes / 1024).toFixed(0)} KiB in ${pages.toLocaleString()} pages\n` +
    `${label("free pages")}${ex.freePages().toLocaleString()}\n` +
    `${label("reused pages")}${ex.reusedPages().toLocaleString()}\n` +
    `${label("per point")}${points ? (bytes / points).toFixed(0) : 0} bytes\n` +
    `${label("seed")}${seed}` +
    (failure ? `\n<span style="color:#f87171">${failure}</span>` : "");
}

function refreshMap() {
  if (el.storage.classList.contains("hidden")) return;
  let total = 0;
  try {
    total = ex.snapshotPages(storageDirty ? 1 : 0);
    if (storageDirty && total) storageDirty = false;
  } catch (error) { return; }
  const roles = new Uint8Array(ex.memory.buffer, ex.pageRolesPtr(), total);

  // One pixel per page, laid out row-major, then scaled up by the canvas CSS.
  const columns = 96;
  const rows = Math.max(1, Math.ceil(total / columns));
  mapCanvas.width = columns;
  mapCanvas.height = rows;
  const image = mapCtx.createImageData(columns, rows);
  const tally = new Array(ROLE_NAMES.length).fill(0);
  for (let i = 0; i < total; i++) {
    const role = roles[i];
    tally[role] = (tally[role] || 0) + 1;
    const colour = ROLE_COLOURS[role] || ROLE_COLOURS[0];
    const p = i * 4;
    image.data[p] = parseInt(colour.slice(1, 3), 16);
    image.data[p + 1] = parseInt(colour.slice(3, 5), 16);
    image.data[p + 2] = parseInt(colour.slice(5, 7), 16);
    image.data[p + 3] = 255;
  }
  mapCtx.putImageData(image, 0, 0);

  const parts = [];
  for (let role = 1; role < ROLE_NAMES.length; role++) {
    if (tally[role]) parts.push(`${tally[role].toLocaleString()} ${ROLE_NAMES[role]}`);
  }
  el.mapStats.textContent = `${total.toLocaleString()} pages · ${parts.join(" · ")}`;
}

// --- input -----------------------------------------------------------------
let dragging = false, lastX = 0, lastY = 0;

function orbitBy(ddx, ddy) {
  if (!ex) return;
  // Screen Y grows downward while positive camera pitch moves upward.
  const pitchSign = el.invertMouse.checked ? 1 : -1;
  ex.orbit(-ddx * 0.006, pitchSign * ddy * 0.006);
  dirty = true;
}
function dollyBy(factor) {
  if (!ex) return;
  ex.dolly(factor);
  dirty = true;
}

canvas.addEventListener("mousedown", (e) => {
  dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.classList.add("drag");
});
addEventListener("mousemove", (e) => {
  if (!dragging) return;
  orbitBy(e.clientX - lastX, e.clientY - lastY);
  lastX = e.clientX; lastY = e.clientY;
});
addEventListener("mouseup", () => { dragging = false; canvas.classList.remove("drag"); });
canvas.addEventListener("wheel", (e) => {
  if (!ex) return;
  e.preventDefault();
  dollyBy(e.deltaY < 0 ? 1 / 1.15 : 1.15);   // wheel up = zoom in
}, { passive: false });

// One finger orbits, same as a mouse drag; two fingers pinch to dolly. #sky has
// touch-action: none, so these are the only handlers touch input reaches.
let pinching = false, pinchDist = 0;
function touchDist(e) {
  const a = e.touches[0], b = e.touches[1];
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}
canvas.addEventListener("touchstart", (e) => {
  if (e.touches.length === 1) {
    dragging = true; pinching = false;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  } else if (e.touches.length === 2) {
    pinching = true; dragging = false;
    pinchDist = touchDist(e);
  }
  e.preventDefault();
}, { passive: false });
addEventListener("touchmove", (e) => {
  if (pinching && e.touches.length === 2) {
    const d = touchDist(e);
    // Spread fingers apart (d grows) to zoom in, same feel as scrolling up.
    if (d > 0 && pinchDist > 0) dollyBy(pinchDist / d);
    pinchDist = d;
    e.preventDefault();
  } else if (dragging && e.touches.length === 1) {
    orbitBy(e.touches[0].clientX - lastX, e.touches[0].clientY - lastY);
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    e.preventDefault();
  }
}, { passive: false });
addEventListener("touchend", (e) => {
  if (e.touches.length === 0) {
    dragging = false; pinching = false;
  } else if (e.touches.length === 1) {
    pinching = false; dragging = true;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  }
});

function newCloud() {
  seed = (Math.random() * 4294967296) >>> 0;
  const points = Math.min(500000, Math.max(1000, Number(el.points.value) || 60000));
  try {
    ensure(ex.format(seed, points, 12), "new cloud");
    ex.setDetail(Number(el.detail.value) / 100);
    failure = "";
  } catch (error) {
    failure = `${error}`;
  }
  dirty = true;
  storageDirty = true;
  persist();
}

el.reset.onclick = newCloud;
el.add.onclick = () => { ex.insertPoints(10000); dirty = true; storageDirty = true; persist(); };
el.remove.onclick = () => {
  if (removing) return;
  removing = true;
  el.remove.disabled = true;
  let remaining = 5000;
  const removeBatch = () => {
    const removed = ex.removePoints(Math.min(64, remaining));
    remaining -= removed;
    dirty = true;
    storageDirty = true;
    if (removed !== 0 && remaining !== 0) {
      requestAnimationFrame(removeBatch);
      return;
    }
    removing = false;
    el.remove.disabled = false;
    persist();
  };
  requestAnimationFrame(removeBatch);
};
el.invertMouse.checked = localStorage.getItem("cloud-invert-mouse") === "1";
el.invertMouse.onchange = () => {
  localStorage.setItem("cloud-invert-mouse", el.invertMouse.checked ? "1" : "0");
};
el.detail.oninput = () => {
  el.detailValue.value = `${el.detail.value}%`;
  if (ex) { ex.setDetail(Number(el.detail.value) / 100); dirty = true; }
};
el.toggleMap.onclick = () => {
  el.storage.classList.toggle("hidden");
  el.toggleMap.textContent = el.storage.classList.contains("hidden") ? "show map" : "hide map";
  dirty = true;
};
el.download.onclick = () => {
  const blob = new Blob([imageBytes()], { type: "application/octet-stream" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "cloud.cld";
  link.click();
  URL.revokeObjectURL(link.href);
};
el.upload.onchange = async () => {
  const file = el.upload.files[0];
  if (!file) return;
  try { importBytes(await file.arrayBuffer()); failure = ""; }
  catch (error) { failure = `${error}`; }
  dirty = true;
  storageDirty = true;
  persist();
};

(async () => {
  resize();
  el.detailValue.value = `${el.detail.value}%`;
  const bytes = await (await fetch("cloud.wasm")).arrayBuffer();
  ex = (await WebAssembly.instantiate(bytes, {})).instance.exports;

  const saved = await dbGet().catch(() => null);
  let restored = false;
  if (saved) {
    try { importBytes(saved); restored = true; } catch (error) { failure = `${error}`; }
  }
  if (!restored) newCloud();
  ex.setDetail(Number(el.detail.value) / 100);
  requestAnimationFrame(draw);
})();
</script>
