<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fullaz-db dispatch</title>
<style>
  body { max-width: 42rem; margin: 8vh auto; padding: 0 1.25rem; background: #10151c; color: #dbe7f3; font: 16px/1.5 system-ui, sans-serif; }
  button { padding: .6rem .9rem; background: #3b82f6; color: white; border: 0; border-radius: .4rem; font: inherit; cursor: pointer; }
  code { color: #93c5fd; }
</style>
<h1>fullaz-db dispatch</h1>
<p>Replays one deterministic work-order transaction on an in-memory database.</p>
<p>It composes B+ tree indexes, R-tree service areas, a slot heap, audit chain store, and editable runbook.</p>
<button id="replay">Replay scenario</button>
<p id="status">Loading WASM...</p>
<script>
  (async () => {
    const bytes = await (await fetch("dispatch.wasm")).arrayBuffer();
    const wasm = (await WebAssembly.instantiate(bytes, {})).instance;
    const status = document.querySelector("#status");
    const replay = () => { status.textContent = wasm.exports.replay() === 0 ? "Scenario verified." : "Scenario failed."; };
    document.querySelector("#replay").onclick = replay;
    replay();
  })().catch(error => { document.querySelector("#status").textContent = `WASM load failed: ${error}`; });
</script>
</html>
